name: Check skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python scripts/package_skill.py
      - run: git diff --exit-code -- physics-lab-report
