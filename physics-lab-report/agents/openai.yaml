interface:
  display_name: "物理实验报告"
  short_description: "生成含可编辑公式、原始照片及可复现绘图的中文实验报告"
  default_prompt: "请使用 $physics-lab-report 根据我的实验资料、数据文件和原始照片生成 10–20 页的物理实验报告，内容可适当详细。若未上传资料，按我指定的实验名称主动联网检索可靠资料编写，检索来源与说明仅写说明文档，正文不提；不编造测量数据。在数据与原理支持范围内尽量多绘制互补分析图。全部识图由当前模型自身完成，并逐一复核全部资料图表、照片、生成图和最终报告页面。个人信息仅班级、姓名、学号、座位号，居中、无下划线并留空。所有标点宋体，文中所有字母、参数与公式使用 Word 原生公式对象。识读、来源映射和存疑说明仅放说明文档，正文符号、单位及数值保持一致。交付报告、说明文档、图片文件夹和实际使用的代码文件夹，清理本次无用中间产物。"
